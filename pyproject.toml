[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcon-audio-adapter"
version = "0.1.0"
description = "Audio file to vCon adapter - monitors directories for audio files and creates vCons"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "vCon Community"}
]
keywords = ["vcon", "audio", "adapter", "conserver", "telephony"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "vcon-lib>=0.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
duration = [
    "mutagen>=1.46.0",
]
s3 = [
    "boto3>=1.26.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "moto>=4.0.0",
]
all = [
    "vcon-audio-adapter[duration,s3,dev]",
]

[project.scripts]
vcon-audio-adapter = "main:main"

[project.urls]
Homepage = "https://github.com/vcon-dev/vcon-audio-adapter"
Repository = "https://github.com/vcon-dev/vcon-audio-adapter"
Issues = "https://github.com/vcon-dev/vcon-audio-adapter/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_adapter*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=audio_adapter --cov-report=term-missing"
